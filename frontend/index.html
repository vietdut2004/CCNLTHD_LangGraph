<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hỗ trợ tâm lý</title>
  <link rel="icon" href="/frontend/assets/sgu-report.png" type="image/png">
  <link rel="stylesheet" href="/frontend/style.css">
  <script src="/frontend/app.js" defer></script>
</head>
<body>
  <div class="chat-app">
    <aside class="sidebar" aria-label="Chatbot đồng hành">
      <div class="brand">
        <img class="brand-logo" src="/frontend/assets/sgu-report.png" alt="SGU" width="45" height="45">
        <div>
          <div class="brand-title">Hỗ trợ tâm lý</div>
          <div class="brand-subtitle">Chatbot đồng hành</div>
        </div>
      </div>
    </aside>
    <main class="chat-panel">
      <header class="chat-header">
        <h1>Hỗ trợ tâm lý</h1>
        <p>Trợ lý đồng hành trong hành trình tâm lý của bạn</p>
      </header>
      <p class="connection-status" id="connection-status" role="status" hidden></p>
      <section class="messages" id="messages" role="log" aria-label="Cuộc trò chuyện" aria-live="polite" aria-relevant="additions text"></section>
      <form class="composer" id="chat-form">
        <label class="sr-only" for="message-input">Chia sẻ suy nghĩ hoặc cảm xúc của bạn</label>
        <textarea id="message-input" rows="1" maxlength="8000" placeholder="Chia sẻ suy nghĩ hoặc cảm xúc của bạn..." required></textarea>
        <button id="send-button" type="submit">Gửi</button>
      </form>
      <footer class="conversation-footer">Conversation ID: <span id="conversation-id"></span></footer>
    </main>
  </div>
</body>
</html>
